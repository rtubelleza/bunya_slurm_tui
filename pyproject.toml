[project]
name = "bunya-slurm-tui"
version = "0.1.0"
description = "Interactive sbatch wrapper for python scripts on UQ-RCC Bunya"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "questionary>=2.0",
    "rich>=13.0",
]
authors = [
  {name = "Rafael Tubelleza", email = "rafaelrtubelleza@gmail.com"},
]

[project.scripts]
run-slurm = "bunya_slurm_tui.tui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bunya_slurm_tui"]

[tool.uv]